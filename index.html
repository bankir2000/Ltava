<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Лтава</title>

  <!-- PWA -->
  <link rel="manifest" href="/Ltava/manifest.json">
  <meta name="theme-color" content="#f0f4f8">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Лтава">
  <link rel="apple-touch-icon" href="/Ltava/icon-192.png">

  <!-- TailwindCSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <!-- Vue 2 -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
  <!-- vue-the-mask -->
  <script src="https://unpkg.com/vue-the-mask@0.11.1/dist/vue-the-mask.js"></script>

  <style>
    /* ===== СОНЯЧНА ТЕМА — висококонтрастна, легко читається на сонці ===== */

    :root {
      --bg:        #f0f4f8;
      --surface:   #ffffff;
      --border:    #94a3b8;
      --text:      #0f172a;
      --text-dim:  #475569;
      --accent:    #1d4ed8;
      --accent-h:  #1e40af;
      --success:   #15803d;
      --danger:    #b91c1c;
      --danger-h:  #991b1b;
      --cyan:      #0369a1;
      --input-bg:  #e2e8f0;
      --sticky-bg: #f0f4f8;
    }

    * { box-sizing: border-box; }

    html {
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      margin: 0;
    }

    /* Touch-targets ≥ 44px, без zoom на iOS */
    select, input[type="text"], input[type="tel"],
    input[type="date"], input[type="time"], textarea {
      min-height: 44px;
      font-size: 16px !important;
      background: var(--input-bg) !important;
      color: var(--text) !important;
      border: 1.5px solid var(--border) !important;
      border-radius: 6px;
    }
    select option { color: var(--text); background: var(--surface); }
    button { min-height: 44px; font-size: 15px; font-weight: 600; }

    textarea { resize: vertical; }

    /* Label */
    label { color: var(--text); font-weight: 600; font-size: 14px; }

    /* Липкі кнопки внизу */
    .sticky-buttons {
      position: sticky;
      bottom: 0;
      background: var(--sticky-bg);
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
      border-top: 2px solid var(--border);
      z-index: 10;
    }

    /* На малих екранах — на всю ширину */
    @media (max-width: 640px) {
      .mobile-container {
        border-radius: 0 !important;
        box-shadow: none !important;
        border: none !important;
        min-height: 100dvh;
      }
    }
  </style>
</head>

<body>

  <!-- Кореневий елемент Vue-додатку -->
  <div id="app">
    <div class="mobile-container container max-w-xl mx-auto px-4 pt-4 pb-2 sm:rounded-xl sm:my-5 sm:shadow-lg" style="background:var(--surface)">
      <!-- Форма. @submit.prevent блокує стандартну відправку -->
      <form id="form" @submit.prevent>
        <div class="flex flex-col gap-1">

          <!-- ПІДРОЗДІЛ -->
          <div class="flex flex-col mb-2">
            <label for="pidrozdil" class="mb-1 text-left">Підрозділ:</label>
            <!-- Випадаючий список з масиву units -->
            <select
              id="pidrozdil"
              v-model="formData.pidrozdil"
              :class="['w-full p-2 rounded rounded', formData.pidrozdil ? 'text-gray-900' : 'text-gray-400']"
            >
              <option value="" disabled hidden>Оберіть зі списку</option>
              <option v-for="unit in units" :key="unit" :value="unit">{{ unit }}</option>
            </select>
          </div>

          <!-- ПОЗИВНИЙ (префікс + сам позивний з маскою) -->
          <div class="flex flex-col mb-2">
            <label for="pozivniy" class="mb-1 text-left">Позивний:</label>
            <div class="flex gap-2 w-full">
              <!-- Префікс позивного (напр. ВГ / МВГ) -->
              <select
                id="pozivniy-prefix"
                v-model="formData.pozivniyPrefix"
                :class="['w-1/3 p-2 rounded rounded', formData.pozivniyPrefix ? 'text-gray-900' : 'text-gray-400']"
              >
                <option value="" disabled hidden>Оберіть</option>
                <option v-for="prefix in prefixes" :key="prefix" :value="prefix">{{ prefix }}</option>
              </select>

              <!-- Сам позивний: тільки літери/цифри, автоматичний аперкейс -->
              <the-mask
                id="pozivniy"
                type="text"
                v-model="formData.pozivniy"
                class="w-2/3 p-2 rounded rounded"
                mask="AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                :tokens="hexTokens"
                placeholder="Впишіть"
              />
            </div>
          </div>

          <!-- НАСЕЛЕНИЙ ПУНКТ -->
          <div class="flex flex-col mb-2">
            <label for="naseleniy-punkt" class="mb-1 text-left">Н.П.:</label>
            <div class="flex flex-row gap-2 items-center w-full">
              <!-- Маска дозволяє літери, пробіли, автоматичний аперкейс -->
              <the-mask
                id="naseleniy-punkt"
                type="text"
                v-model="formData.naseleniyPunkt"
                class="flex-1 p-2 rounded rounded"
                mask="BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB"
                :tokens="hexTokens"
                placeholder="Впишіть"
              />
            </div>
          </div>

          <!-- ОБЛАСТЬ -->
          <div class="flex flex-col mb-2">
            <label for="oblast" class="mb-1 text-left">Область:</label>
            <div class="flex gap-2 w-full">
              <!-- Область одразу у короткій формі: Сумська, Чернігівська тощо -->
              <select
                id="oblast"
                v-model="formData.oblast"
                :class="['w-full p-2 rounded rounded', formData.oblast ? 'text-gray-900' : 'text-gray-400']"
              >
                <option value="" disabled hidden>Оберіть зі списку</option>
                <option v-for="region in regions" :key="region" :value="region">{{ region }}</option>
              </select>
            </div>
          </div>

          <!-- ДАТА І ЧАС -->
          <div class="flex flex-col mb-2">
            <div class="flex items-center justify-between mb-1">
              <label class="text-left">Час виявлення цілі:</label>
              <div class="flex gap-1">
                <button type="button" @click="adjustTime(-1)"
                  class="hover:opacity-90 text-white text-sm rounded px-2 py-1" style="background:var(--cyan)">-1 хв.</button>
                <button type="button" @click="adjustTime(1)"
                  class="hover:opacity-90 text-white text-sm rounded px-2 py-1" style="background:var(--cyan)">+1 хв.</button>
              </div>
            </div>
            <input
              type="text"
              v-model="formData.datetime"
              @change="parseDatetime"
              placeholder="дд.мм.рррр гг:хх"
              class="w-full p-2 rounded rounded"
            />
          </div>

          <!-- ЗБРОЯ (ТЕПЕР МОЖНА КІЛЬКА ЗАПИСІВ) -->
          <div class="flex flex-col mb-2">
            <label class="mb-1 text-left">Зброя:</label>
            <div class="flex flex-col gap-2">
              <!-- Один запис зброї -->
              <div
                v-for="(w, index) in formData.weapons"
                :key="index"
                class="flex gap-2 items-center"
              >
                <select
                  v-model="w.name"
                  :class="['w-full p-2 rounded rounded', w.name ? 'text-gray-900' : 'text-gray-400']"
                >
                  <option value="" disabled hidden>Оберіть зі списку</option>
                  <option
                    v-for="weaponOption in weapons"
                    :key="weaponOption"
                    :value="weaponOption"
                  >
                    {{ weaponOption }}
                  </option>
                </select>
                <!-- Кнопка "Видалити" показується, якщо зброї більше однієї -->
                <button
                  type="button"
                  class="hover:opacity-90 text-white rounded px-3 py-2" style="background:var(--danger)"
                  @click="removeWeapon(index)"
                  v-if="formData.weapons.length > 1"
                >
                  Видалити
                </button>
              </div>
              <!-- Додати ще одну зброю -->
              <button
                type="button"
                @click="addWeapon"
                class="hover:opacity-90 text-white rounded px-3 py-2 mt-2 self-start" style="background:var(--accent)"
              >
                Додати зброю
              </button>
            </div>
          </div>

          <!-- НОМЕР ЦІЛІ -->
          <div class="flex flex-col mb-2">
            <label for="target-number" class="mb-1 text-left">№ цілі:</label>
            <!-- Маска ####: тільки 4 цифри -->
            <input
              id="target-number"
              type="text"
              v-model="formData.targetNumber"
              v-mask="'####'"
              placeholder="0000"
              class="w-full p-2 rounded rounded"
            />
          </div>

          <!-- ВИСОТА -->
          <div class="flex flex-col mb-2">
            <label for="height" class="mb-1 text-left">Висота:</label>
            <input
              id="height"
              type="text"
              v-model="formData.height"
              v-mask="'####'"
              placeholder="0000"
              class="w-full p-2 rounded rounded"
            />
          </div>

          <!-- РЕЗУЛЬТАТ ЗАСТОСУВАННЯ -->
          <div class="flex flex-col mb-2">
            <label class="mb-1 text-left">Результат:</label>
            <select
              v-model="formData.result"
              :class="['w-full p-2 rounded rounded', formData.result ? 'text-gray-900' : 'text-gray-400']"
            >
              <option value="" disabled hidden>Оберіть зі списку</option>
              <option v-for="result in results" :key="result" :value="result">{{ result }}</option>
            </select>
          </div>

          <!-- РОЗХІД БОЄПРИПАСІВ (показується, якщо зброя застосовувалась і це не вибух) -->
          <div v-if="showRozxid">
            <div class="mb-2">Розхід:</div>
            <div class="flex flex-col gap-2">
              <!-- Один рядок розходу БК -->
              <div v-for="(item, index) in formData.rozxid" :key="index" class="flex flex-col gap-2 items-start">
                <!-- Тип боєприпаса -->
                <select
                  v-model="item.type"
                  :class="['w-full p-2 rounded rounded', item.type ? 'text-gray-900' : 'text-gray-400']"
                >
                  <option value="" disabled hidden>Оберіть зі списку</option>
                  <option v-for="ammo in ammoTypes" :key="ammo" :value="ammo">{{ ammo }}</option>
                </select>
                <!-- Кількість + кнопка видалення рядка -->
                <div class="flex w-full gap-2">
                  <input
                    type="text"
                    v-model="item.quantity"
                    placeholder="Кількість"
                    v-mask="'####'"
                    class="w-full p-2 rounded rounded"
                  />
                  <button
                    type="button"
                    class="hover:opacity-90 text-white rounded px-3 py-2" style="background:var(--danger)"
                    @click="removeRozxid(index)"
                  >
                    Видалити
                  </button>
                </div>
              </div>
              <!-- Кнопка додати ще один рядок розходу -->
              <button
                type="button"
                @click="addRozxid"
                class="hover:opacity-90 text-white rounded px-3 py-2 mt-2" style="background:var(--accent)"
              >
                Додати розхід
              </button>
            </div>
          </div>

          <!-- VIKTOR MR-2 БЛОК РОЗХОДУ (замість стандартного Розхід) -->
          <div v-if="showViktorAmmo" class="flex flex-col gap-3 mb-2">
            <div class="mb-1">Розхід БК ЗУ MR2 VIKTOR 14,5мм:</div>
            <div class="flex flex-col gap-1">
              <label class="text-sm font-semibold" style="color:var(--text-dim)">ЗУ MR2 VIKTOR 14,5мм, стрічка 1БЗТ-3МДЗ</label>
              <input
                type="tel"
                v-model="formData.viktorAmmo1"
                placeholder="Кількість"
                class="w-full p-2 rounded rounded"
              />
            </div>
            <div class="flex flex-col gap-1">
              <label class="text-sm font-semibold" style="color:var(--text-dim)">ЗУ MR2 VIKTOR 14,5мм, стрічка 1БЗТ-2МДЗ</label>
              <input
                type="tel"
                v-model="formData.viktorAmmo2"
                placeholder="Кількість"
                class="w-full p-2 rounded rounded"
              />
            </div>
            <div class="flex flex-col gap-1">
              <label class="text-sm font-semibold" style="color:var(--text-dim)">ЗУ MR2 VIKTOR 14,5мм, стрічка 1БЗТ-1Б32-2МДЗ</label>
              <input
                type="tel"
                v-model="formData.viktorAmmo3"
                placeholder="Кількість"
                class="w-full p-2 rounded rounded"
              />
            </div>
          </div>

          <!-- АК74 БЛОК РОЗХОДУ -->
          <div v-if="showAk74" class="flex flex-col gap-3 mb-2">
            <div class="flex flex-col gap-1">
              <label class="text-sm font-semibold" style="color:var(--text-dim)">АК74-5.45mm</label>
              <input
                type="tel"
                v-model="formData.ak74Ammo"
                placeholder="Кількість"
                class="w-full p-2 rounded rounded"
              />
            </div>
          </div>

          <!-- ОПИС, якщо результат = "вибух" -->
          <div v-if="formData.result === 'вибух'" class="my-4 space-y-2">
            <label>Опис:</label>
            <div class="flex flex-col gap-2">
              <!-- Азимут/дальність -->
              <div class="flex w-full flex-row items-center gap-4">
                <span class="w-auto">А-</span>
                <input
                  type="text"
                  v-model="formData.angle"
                  v-mask="'###'"
                  placeholder="360"
                  maxlength="3"
                  class="w-full p-2 rounded rounded"
                  @input="onAngleInput"
                />
                <span class="w-auto">Д-</span>
                <input
                  type="text"
                  v-model="formData.distance"
                  v-mask="'#####'"
                  inputmode="numeric"
                  pattern="\d*"
                  placeholder="00000"
                  maxlength="5"
                  class="w-full p-2 rounded rounded"
                />
              </div>

              <!-- Вибух: кількість, місце (на землі / у повітрі) -->
              <div class="flex gap-4">
                <input
                  type="text"
                  value="вибух"
                  readonly
                  class="w-full p-2 rounded"                />
                <select
                  v-model="formData.explosionCount"
                  :class="['w-full p-2 rounded rounded', formData.explosionCount ? 'text-gray-900' : 'text-gray-400']"
                >
                  <option value="" disabled hidden>Кількість</option>
                  <option v-for="n in 9" :key="n" :value="n">{{ n }}</option>
                </select>
                <select
                  v-model="formData.explosionPlace"
                  :class="['w-full p-2 rounded rounded', formData.explosionPlace ? 'text-gray-900' : 'text-gray-400']"
                >
                  <option value="" disabled hidden>Місце</option>
                  <option value="на землі">на землі</option>
                  <option value="у повітрі">у повітрі</option>
                </select>
              </div>

              <!-- Стан справ (короткий текст) -->
              <div>
                <input
                  type="text"
                  v-model="formData.explosionStatus"
                  class="w-full p-2 rounded rounded"
                  placeholder="Стан справ на ОКІ"
                  maxlength="64"
                />
              </div>
            </div>
          </div>

          <!-- ОПИС, якщо зброя застосовувалась (не вибух, не "не застосовувалась") -->
          <div v-if="formData.result !== 'вибух' && formData.result !== 'не застосовувалась'" class="my-4">
            <label>Опис:</label>
            <div class="flex flex-col gap-2">
              <!-- А, Д, К -->
              <div class="flex flex-row gap-4">
                <div class="flex items-center gap-1 w-1/3">
                  <span>А-</span>
                  <input
                    type="text"
                    v-model="formData.angle"
                    v-mask="'###'"
                    placeholder="360"
                    maxlength="3"
                    class="w-full p-2 rounded rounded"
                    @input="onAngleInput"
                  />
                </div>
                <div class="flex items-center gap-1 w-1/3">
                  <span>Д-</span>
                  <input
                    type="text"
                    v-model="formData.distance"
                    v-mask="'#####'"
                    inputmode="numeric"
                    pattern="\d*"
                    placeholder="00000"
                    maxlength="5"
                    class="w-full p-2 rounded rounded"
                  />
                </div>
                <div class="flex items-center gap-1 w-1/3">
                  <span>К-</span>
                  <input
                    type="text"
                    v-model="formData.krok"
                    v-mask="'###'"
                    placeholder="360"
                    maxlength="3"
                    class="w-full p-2 rounded rounded"
                    @input="onKrokInput"
                  />
                </div>
              </div>

              <!-- Дія (обстріляно/знищено), кількість, клас цілі -->
              <div class="flex flex-row gap-4 mt-2">
                <div class="w-1/3">
                  <!-- Якщо результат "не знищено" — фіксований напис "обстріляно" -->
                  <input
                    v-if="formData.result === 'не знищено'"
                    type="text"
                    value="обстріляно"
                    readonly
                    class="w-full p-2 rounded"                  />
                  <!-- Якщо результат "ЗНИЩЕНО" — фіксований напис "ЗНИЩЕНО" -->
                  <input
                    v-else-if="formData.result === 'ЗНИЩЕНО'"
                    type="text"
                    value="ЗНИЩЕНО"
                    readonly
                    class="w-full p-2 rounded"                  />
                  <!-- Інші випадки: можна вибрати дію вручну -->
                  <select
                    v-else
                    v-model="formData.action"
                    :class="['w-full p-2 rounded rounded', formData.action ? 'text-gray-900' : 'text-gray-400']"
                  >
                    <option value="" disabled hidden>Оберіть дію</option>
                    <option v-for="action in actions" :key="action" :value="action">{{ action }}</option>
                  </select>
                </div>

                <!-- Кількість цілей -->
                <div class="w-1/3">
                  <select
                    v-model="formData.targetCount"
                    :class="['w-full p-2 rounded rounded', formData.targetCount ? 'text-gray-900' : 'text-gray-400']"
                  >
                    <option value="" disabled hidden>Кількість</option>
                    <option v-for="n in 9" :key="n" :value="n">{{ n }}</option>
                  </select>
                </div>

                <!-- Клас цілі (БПЛА/КР) + тип БПЛА -->
                <div class="w-1/3 flex flex-col gap-2">
                  <select
                    v-model="formData.targetClass"
                    :class="['w-full p-2 rounded rounded', formData.targetClass ? 'text-gray-900' : 'text-gray-400']"
                  >
                    <option value="" disabled hidden>Клас</option>
                    <option value="БПЛА">БПЛА</option>
                    <option value="КР">КР</option>
                  </select>
                  <select
                    v-if="formData.targetClass === 'БПЛА'"
                    v-model="formData.type"
                    :class="['w-full p-2 rounded rounded', formData.type ? 'text-gray-900' : 'text-gray-400']"
                  >
                    <option value="" disabled hidden>Тип БПЛА</option>
                    <option v-for="type in uavTypes" :key="type" :value="type">{{ type }}</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <!-- ОПИС, якщо "не застосовувалась" -->
          <div v-if="formData.result === 'не застосовувалась'" class="my-4 space-y-2">
            <label>Опис:</label>
            <div class="flex flex-col items-center gap-2">
              <!-- А, Д, К -->
              <div class="flex flex-row items-center gap-2 w-full">
                <span class="w-auto">А-</span>
                <input
                  type="text"
                  v-model="formData.angle"
                  v-mask="'###'"
                  placeholder="360"
                  maxlength="3"
                  class="w-full p-2 rounded rounded"
                  @input="onAngleInput"
                />
                <span class="w-auto">Д-</span>
                <input
                  type="text"
                  v-model="formData.distance"
                  v-mask="'#####'"
                  inputmode="numeric"
                  pattern="\d*"
                  placeholder="00000"
                  maxlength="5"
                  class="w-full p-2 rounded rounded"
                />
                <span class="w-auto">К-</span>
                <input
                  type="text"
                  v-model="formData.krok"
                  v-mask="'###'"
                  placeholder="360"
                  maxlength="3"
                  class="w-full p-2 rounded rounded"
                  @input="onKrokInput"
                />
              </div>

              <!-- Режим виявлення, кількість, клас, тип БПЛА -->
              <div class="flex flex-row gap-2 w-full">
                <select
                  v-model="formData.detectionMode"
                  :class="['w-full p-2 rounded rounded', formData.detectionMode ? 'text-gray-900' : 'text-gray-400']"
                >
                  <option value="" disabled hidden>Виявлено</option>
                  <option value="акустично">акустично</option>
                  <option value="візуально">візуально</option>
                </select>
                <select
                  v-model="formData.targetCount"
                  :class="['w-full p-2 rounded rounded', formData.targetCount ? 'text-gray-900' : 'text-gray-400']"
                >
                  <option value="" disabled hidden>Кільк.</option>
                  <option v-for="n in 9" :key="n" :value="n">{{ n }}</option>
                </select>
                <select
                  v-model="formData.targetClass"
                  :class="['w-full p-2 rounded rounded', formData.targetClass ? 'text-gray-900' : 'text-gray-400']"
                >
                  <option value="" disabled hidden>Клас</option>
                  <option value="БПЛА">БПЛА</option>
                  <option value="КР">КР</option>
                </select>
              </div>

        this.formData.time = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
        this.formData.datetime = this._buildDatetime(this.formData.date, this.formData.time);

        // Відновлюємо лише постійні поля
        const saved = localStorage.getItem('staticFormData');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            const staticKeys = ['pidrozdil', 'pozivniyPrefix', 'pozivniy', 'naseleniyPunkt', 'oblast', 'weapons', 'personnel'];

              }

              const oldWeapon = this.formData.zbroya || '';
              this.formData.weapons = [{ name: oldWeapon }];

      methods: {
        // Будує рядок "дд.мм.рррр гг:хх" з внутрішніх полів date/time
        _buildDatetime(dateStr, timeStr) {
          if (!dateStr) return '';
          const [yyyy, mm, dd] = dateStr.split('-');
          return `${dd}.${mm}.${yyyy} ${timeStr || '00:00'}`;
        },

        // Розбирає рядок "дд.мм.рррр гг:хх" назад у date/time
        parseDatetime() {
          const val = (this.formData.datetime || '').trim();
          const m = val.match(/^(\d{2})\.(\d{2})\.(\d{4})\s+(\d{2}):(\d{2})$/);
          if (m) {
            this.formData.date = `${m[3]}-${m[2]}-${m[1]}`;
            this.formData.time = `${m[4]}:${m[5]}`;
          }
        },

        // Зміщує час на ±delta хвилин
        adjustTime(delta) {
          this.parseDatetime();
          const [yyyy, mm, dd] = (this.formData.date || '').split('-').map(Number);
          const [hh, min] = (this.formData.time || '00:00').split(':').map(Number);
          if (!yyyy) return;
          const d = new Date(yyyy, mm - 1, dd, hh, min + delta);
          const pad = n => String(n).padStart(2, '0');
          this.formData.date = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
          this.formData.time = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
          this.formData.datetime = this._buildDatetime(this.formData.date, this.formData.time);
        },

        _saveStatic() {
          const staticData = {
            pidrozdil:      this.formData.pidrozdil,
            pozivniyPrefix: this.formData.pozivniyPrefix,
            pozivniy:       this.formData.pozivniy,
            naseleniyPunkt: this.formData.naseleniyPunkt,
            oblast:         this.formData.oblast,
            weapons:        this.formData.weapons,
            personnel:      this.formData.personnel,
          };
          localStorage.setItem('staticFormData', JSON.stringify(staticData));
        },

          this.formData.rozxid.push({ type: '', quantity: null });
        },

        removeRozxid(index) {
          this.formData.rozxid.splice(index, 1);

        addPersonnel() {
          this.formData.personnel.push({ rank: '', pib: '', onBch: false });

            this.formData.weapons.splice(index, 1);
          }

          const _utcTime = `${_pad(_now.getHours())}:${_pad(_now.getMinutes())}`;
          this.formData = {

            pozivniy: '',
            naseleniyPunkt: '',
            oblast: '',

            action: '',

            type: '',

            explosionCount: '',

            explosionStatus: '',

          localStorage.removeItem('staticFormData');
        },

        copyData() {
          // Синхронізуємо datetime -> date/time перед копіюванням
          this.parseDatetime();
          // Локальні змінні для відображення — не змінюємо formData
          const angle    = this.formData.angle    || '0';
          const distance = this.formData.distance || '0';
          const krok     = this.formData.krok     || '0';
          let   height   = this.formData.height   || '0';
          const targetNumberRaw = this.formData.targetNumber || '0000';

          if (this.formData.result === 'вибух' && this.formData.explosionPlace === 'на землі') {
            height = '0';
          }

          const formatDate = (dateStr) => {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length !== 3) return dateStr;
            const [yyyy, mm, dd] = parts;
            return `${dd}.${mm}.${yyyy}`;
          };

          const formattedDate = formatDate(this.formData.date);

          let targetNumberDisplay = targetNumberRaw;
          if (!targetNumberDisplay || /^0+$/.test(targetNumberDisplay)) {
            targetNumberDisplay = 'б/н';
          }

          let resultText = this.formData.result || '';
          let oblastShort = this.formData.oblast || '';

          const weaponsSelected = (this.formData.weapons || [])
            .map(w => w && w.name ? w.name : '')
            .filter(Boolean);
          const weaponsLine = weaponsSelected.join(', ');

          const ammoSummary = (items) => {
            const regexNabiy = /^(Набій|Снаряд)\s(.+)$/;
            const grouped = {};
            let zkr = 0;
            let nbzh = 0;

            items.forEach(item => {
              const line = item.type;
              const qty = parseInt(item.quantity, 10);
              if (!line || isNaN(qty)) return;

              if (line.startsWith('Розхід ЗКР')) {
                zkr += qty;
              } else if (line.startsWith('Розхід НБЖ')) {
                nbzh += qty;
              } else {
                const match = line.match(regexNabiy);
                if (match) {
                  const kind = match[1];
                  const name = match[2];
                  const key = `${kind} ${name}`;
                  if (!grouped[key]) grouped[key] = 0;
                  grouped[key] += qty;
                }
              }
            });

            const lines = [];
            Object.entries(grouped).forEach(([key, qty]) => {
              lines.push(`${key} - ${qty}`);
            });
            if (zkr > 0) lines.push(`Розхід ЗКР - ${zkr}`);
            if (nbzh > 0) lines.push(`Розхід НБЖ - ${nbzh}`);
            return lines;
          };

          let text = `Дата: ${formattedDate}
Час: ${this.formData.time || ''}
№ цілі: ${targetNumberDisplay}
Результат: ${resultText}
Н.П.: ${this.formData.naseleniyPunkt}
Обл.: ${oblastShort}
Підрозділ: ${this.formData.pidrozdil}
Позивний: ${this.formData.pozivniyPrefix} ${this.formData.pozivniy}
Зброя: ${weaponsLine}
Висота: ${height}`;

          if (this.formData.result === 'вибух') {
            const vibukhWord = Number(this.formData.explosionCount) > 1 ? 'вибухи' : 'вибух';
            text += `\nОпис: А-${angle}, Д-${distance} ${vibukhWord} ${this.formData.explosionCount} ${this.formData.explosionPlace} ${this.formData.explosionStatus}`;
          } else if (this.formData.result === 'не застосовувалась') {
            text += `\nОпис: А-${angle}, Д-${distance}, К-${krok}`;
            if (this.formData.detectionMode) text += `, ${this.formData.detectionMode}`;
            if (this.formData.targetCount) text += ` ${this.formData.targetCount}`;
            if (this.formData.targetClass) text += ` ${this.formData.targetClass}`;
            if (this.formData.targetClass === 'БПЛА' && this.formData.type) {
              text += ` ${this.formData.type}`;
            }
          } else {
            text += `\nОпис: А-${angle}, Д-${distance}, К-${krok}`;
            if (this.formData.result === 'не знищено') {
              text += `, обстріляно`;
            } else if (this.formData.result === 'ЗНИЩЕНО') {
              text += `, ЗНИЩЕНО`;
            } else if (this.formData.action) {
              text += `, ${this.formData.action}`;
            }
            if (this.formData.targetCount) text += ` ${this.formData.targetCount}`;
            if (this.formData.targetClass) text += ` ${this.formData.targetClass}`;
            if (this.formData.targetClass === 'БПЛА' && this.formData.type) {
              text += ` ${this.formData.type}`;
            }
          }

          const personnel = this.formData.personnel
            .filter(p => p.rank && p.pib && p.onBch)
            .map(p => `${p.rank} ${p.pib}`)
            .join(', ');
          if (personnel) text += `, ${personnel}`;

          const commentText = this.formData.comment && this.formData.comment.trim()
            ? this.formData.comment.trim()
            : '-';
          text += `\nКоментар: ${commentText}`;

          if (this.showRozxid) {
            const ammoLines = ammoSummary(this.formData.rozxid);
            ammoLines.forEach(line => {
              text += `\n${line}`;
            });
          }

          // Viktor MR-2 розрахунок БК
          if (this.showViktorAmmo) {
            let total = 0, bzt = 0, mdz = 0, b32 = 0;

            const a1 = Number(this.formData.viktorAmmo1);
            if (a1 > 0) {
              total += a1;
              const b = Math.round(a1 / 4);
              bzt += b; mdz += a1 - b;
            }

            const a2 = Number(this.formData.viktorAmmo2);
            if (a2 > 0) {
              total += a2;
              const b = Math.round(a2 / 3);
              bzt += b; mdz += a2 - b;
            }

            const a3 = Number(this.formData.viktorAmmo3);
            if (a3 > 0) {
              total += a3;
              const full = Math.floor(a3 / 4);
              const rem = a3 % 4;
              let b3 = full, b32_3 = full, m3 = full * 2;
              if (rem >= 1) b3 += 1;
              if (rem >= 2) b32_3 += 1;
              if (rem === 3) m3 += 1;
              bzt += b3; b32 += b32_3; mdz += m3;
            }

            if (total > 0) {
              text += `\nНабій 14,5х114 мм (ЗПУ, КПВТ) БЗТ-${bzt}\nНабій 14,5х114 мм (ЗПУ, КПВТ) МДЗ-${mdz}\nНабій 14,5х114 мм (ЗПУ, КПВТ) Б-32 -${b32}`;
            }
          }

          // AK74 розрахунок БК
          if (this.showAk74) {
            const amt = Number(this.formData.ak74Ammo);
            if (amt > 0) {
              const tz = Math.round(amt / 3);
              const ps = amt - tz;
              text += `\nНабій 5,45х39 мм ТЗ-${tz}\nНабій 5,45х39 мм ПС-${ps}`;
            }
          }

          text = text
            .split('\n')
            .map(line => line.trimStart())
            .join('\n');

          navigator.clipboard.writeText(text).then(() => {
            this.copySuccess = true;
            setTimeout(() => { this.copySuccess = false; }, 2000);
          });
        },

        onAngleInput(e) {
          let val = Number(e.target.value);
          if (val > 360) val = 360;
          if (val < 0) val = 0;
          this.formData.angle = val ? String(val) : '';
        },

        onKrokInput(e) {
          let val = Number(e.target.value);
          if (val > 360) val = 360;
          if (val < 0) val = 0;
          this.formData.krok = val ? String(val) : '';
        }
      }
    });
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/Ltava/sw.js', { scope: '/Ltava/' })
          .then(r => console.log('SW:', r.scope))
          .catch(e => console.warn('SW помилка:', e));
      });
    }
  </script>
</body>
